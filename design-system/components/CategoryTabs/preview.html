<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>CategoryTabs</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;700;800&display=swap"></head>
<body>
<div id="root" class=""></div>
<script>
  var Y = window.YoungTrip, h = React.createElement;
  function Demo(){ var s = React.useState('all'); return h(Y.CategoryTabs, { value: s[0], onChange: s[1], items: [{key:'all',label:'전체',icon:'home'},{key:'ongoing',label:'진행중',icon:'clock'},{key:'upcoming',label:'예정',icon:'cal'},{key:'done',label:'완료',icon:'check'},{key:'saved',label:'저장',icon:'heart'}] }); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
