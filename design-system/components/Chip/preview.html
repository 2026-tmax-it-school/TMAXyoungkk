<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Chip</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;700;800&display=swap"></head>
<body>
<div id="root" class="yt-demo"></div>
<script>
  var Y = window.YoungTrip, h = React.createElement;
  function Demo(){ var s = React.useState(['food']); function t(k){ s[1](s[0].indexOf(k) >= 0 ? s[0].filter(function(x){return x!==k;}) : s[0].concat(k)); } return h(React.Fragment, null, [['food','맛집'],['nature','자연'],['cafe','카페'],['history','역사']].map(function(c){ return h(Y.Chip, { key: c[0], selected: s[0].indexOf(c[0]) >= 0, onClick: function(){ t(c[0]); } }, c[1]); }), h(Y.Chip, { icon: 'clock', count: 3 }, '제외 스팟')); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
