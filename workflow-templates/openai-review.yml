name: OpenAI code review
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Fork PR number (administrator approval)'
        required: true
        type: string
      head-sha:
        description: 'Exact latest 40-character head SHA to review'
        required: true
        type: string
      base-branch:
        description: 'PR target branch: main or develop'
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  review:
    if: >-
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        github.run_attempt == 1)) &&
      vars.OPENAI_REVIEW_ENABLED == 'true' &&
      vars.OPENAI_REVIEW_BUDGET_CONFIRMED == 'true'
    uses: 2026-tmax-it-school/TMAXyoungkk/.github/workflows/openai-review-reusable.yml@b60fdb88e1b51379a1922df6b8fbbd1aa188073b
    with:
      ci-name: CI
      ci-path: .github/workflows/ci.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

