name: OpenAI code review
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  review:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.OPENAI_REVIEW_ENABLED == 'true' &&
      vars.OPENAI_REVIEW_BUDGET_CONFIRMED == 'true'
    uses: ./.github/workflows/openai-review-reusable.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
