name: OpenAI reviewer tests
on:
  pull_request:
    paths: ['.github/scripts/**', '.github/workflows/openai-review*.yml']
  push:
    branches: [main]
    paths: ['.github/scripts/**', '.github/workflows/openai-review*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test .github/scripts/openai-review.test.mjs
